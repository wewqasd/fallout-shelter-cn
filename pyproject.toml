[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-cn"
version = "5.13"
description = "《辐射避难所》Steam 版中文汉化（源码构建版）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["unitypy==1.25.3"]

[project.scripts]
fs-cn-patch = "fs_cn.cli:main"
fs-cn-gui = "fs_cn.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
