name: Build EXE

# 上传 Release 资产需要写权限
permissions:
  contents: write

on:
  workflow_dispatch:        # 手动触发（Actions 页点 Run workflow）
  release:
    types: [published]      # 发布 Release 时自动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 版本固定：避免 CI 每次解析到最新的 PyInstaller / 传递依赖，
        # 造成产物体积与 md5 无谓漂移（详见 .gitattributes 的可复现性说明）。
        run: |
          py -3.12 -m pip install --upgrade pip
          py -3.12 -m pip install "unitypy==1.25.3" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.9"
          py -3.12 -m pip list

      - name: Build EXE (PyInstaller)
        run: py -3.12 -m PyInstaller --noconfirm --clean tools\build_exe.spec

      - name: Selfcheck (headless)
        run: |
          chcp 65001 > $null
          $env:PYTHONIOENCODING = 'utf-8'
          dist\FalloutShelterCN.exe --selfcheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist\FalloutShelterCN.exe -Algorithm MD5 | Select-Object -ExpandProperty Hash

      - name: Upload EXE to Release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist\FalloutShelterCN.exe --clobber

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FalloutShelterCN.exe
          path: dist/FalloutShelterCN.exe
          if-no-files-found: error
